[project]
name = "sports-agency"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sllm05", email = "“dandyjun88@hanmail.net”" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "google-genai>=3.0.0",
    "httpx>=0.28.1",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0",
    "numpy>=2.4.6",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
sports-agency = "sports_agency:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
